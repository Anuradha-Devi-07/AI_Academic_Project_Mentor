<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0D12" />
    <script>
      // Apply the saved theme preference (dark by default) before first paint so the page never flashes.
      (function () {
        var pref = 'dark'
        try { pref = JSON.parse(localStorage.getItem('projectmentor:theme')) || 'dark' } catch (e) {}
        var theme = pref === 'system' ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : pref === 'light' ? 'light' : 'dark'
        document.documentElement.dataset.theme = theme
        if (theme === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F7F6F2')
      })()
    </script>
    <meta name="description" content="Turn your academic project idea into a clear, actionable plan with AI-powered project mentoring." />
    <title>ProjectMentor AI — From idea to impact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
